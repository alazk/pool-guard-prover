# One SP1 proof per run, made with the open-source prover on a free GitHub-hosted runner
# (4 cores, 16 GB, Docker). The console's /api/prove starts a run with the issuer's signed record
# and a request id; the proof lands as proof-<request>.json on the rolling "proofs" release,
# where /api/proof finds it. See app/src/prover.js (PROVER=actions) and docs/SP1-CUTOVER.md.
#
# The prover runs with its own defaults: its keys take about 7 GB before proving starts, which fits the 16 GB a public
# repo's runner has (a private repo's 7 GB runner does not fit them, which is why this runs in a
# public repo). Cutting its workers and queues to one each stalled it: the stages wait on each
# other. Up to 24 GB of swap, made after clearing the runner's unused toolchains, is the safety
# net. The program is executed once first (seconds), and every two minutes the log shows memory,
# swap and the busiest processes, so a stall is visible. The circuit artifacts (about 1 GB) are
# cached between runs once one has finished.

name: prove
on:
  workflow_dispatch:
    inputs:
      request:
        description: the request id (0x + 64 hex), names the result
        required: true
      input:
        description: the prover input, sealed with PROVER_INPUT_KEY (v1.<base64>)
        required: true
permissions: { contents: write }
concurrency: { group: "prove-${{ inputs.request }}", cancel-in-progress: false }
jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with: { sparse-checkout: "sp1/elf", sparse-checkout-cone-mode: false }
      # PG_PROVER set on the runner wins; otherwise the glibc build from the pg-prover release
      - name: The prover CLI
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          if [ -n "${PG_PROVER:-}" ] && [ -x "$PG_PROVER" ]; then echo "using $PG_PROVER"; else
            gh release download pg-prover --pattern pg-prover-gnu --output pg-prover --clobber && chmod +x pg-prover && echo "PG_PROVER=$PWD/pg-prover" >> "$GITHUB_ENV"; fi
      - name: Already proven?
        id: have
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          if gh release download proofs --pattern "proof-${{ inputs.request }}.json" --output /dev/null 2>/dev/null; then echo "done=1" >> "$GITHUB_OUTPUT"; echo "a proof for this request is already published"; else echo "done=0" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/cache@v4
        if: steps.have.outputs.done == '0' && runner.environment == 'github-hosted'
        with:
          path: ~/.sp1/circuits
          key: sp1-circuits-${{ hashFiles('sp1/elf/vkey.json') }}
      # The runner's disk is mostly preinstalled toolchains this job never uses. Clear them, then
      # make swap from what is free, keeping 20 GB for the circuit files and the Groth16 image.
      - name: Disk and swap
        if: steps.have.outputs.done == '0' && runner.environment == 'github-hosted'
        run: |
          df -h / /mnt 2>/dev/null | sed 1d
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/share/swift /usr/local/share/powershell /usr/local/share/chromium /opt/microsoft /opt/google /usr/lib/jvm || true
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          sudo swapoff -a || true; sudo rm -f /mnt/swapfile /swapfile
          # the swap file goes on whichever of / and /mnt has more room
          D=/; [ -d /mnt ] && [ "$(df --output=avail -BG /mnt | tail -1 | tr -dc 0-9)" -gt "$(df --output=avail -BG / | tail -1 | tr -dc 0-9)" ] && D=/mnt
          FREE=$(df --output=avail -BG / | tail -1 | tr -dc 0-9); FREE_D=$(df --output=avail -BG "$D" | tail -1 | tr -dc 0-9)
          # keep 20 GB free on / (circuits, docker); on a separate /mnt keep 2
          if [ "$D" = / ]; then SWAP=$(( FREE - 20 )); else SWAP=$(( FREE_D - 2 )); fi
          [ "$SWAP" -gt 24 ] && SWAP=24
          if [ "$SWAP" -ge 4 ]; then sudo fallocate -l "${SWAP}G" "$D/swapfile.pg" && sudo chmod 600 "$D/swapfile.pg" && sudo mkswap "$D/swapfile.pg" >/dev/null && sudo swapon "$D/swapfile.pg"; echo "swap ${SWAP} GB on $D"; else echo "not enough disk for swap"; fi
          df -h / /mnt 2>/dev/null | sed 1d; free -g; nproc
      - name: Prove
        if: steps.have.outputs.done == '0'
        env:
          SEALED: ${{ inputs.input }}
          INPUT_KEY: ${{ secrets.PROVER_INPUT_KEY }}
          SP1_PROVER: cpu
          RUST_LOG: info
        run: |
          # memory and swap every two minutes, so a slow run shows whether it is computing or swapping
          ( while sleep 120; do echo "[mem] $(free -m | awk '/^Mem/{printf "used %d of %d MB", $3, $2} /^Swap/{printf ", swap %d MB", $3}'), disk free $(df --output=avail -h / | tail -1 | tr -d ' '); cpu: $(ps -eo pcpu=,comm= --sort=-pcpu | head -3 | awk '{printf "%s %s%%  ", substr($2,1,24), $1}')"; done ) &
          # the input carries the issuer's signed record, limit included: it arrives sealed and is
          # opened here with the repo's secret, never printed
          node -e '
            const c = require("crypto"), [v, b] = String(process.env.SEALED).split(".");
            if (v !== "v1" || !b) throw new Error("the input is not sealed (v1.<base64>)");
            const k = Buffer.from(String(process.env.INPUT_KEY).replace(/^0x/, ""), "hex");
            if (k.length !== 32) throw new Error("the PROVER_INPUT_KEY secret is missing or not 32 bytes of hex");
            const raw = Buffer.from(b, "base64"), d = c.createDecipheriv("aes-256-gcm", k, raw.subarray(0, 12));
            d.setAuthTag(raw.subarray(12, 28));
            require("fs").writeFileSync("input.json", Buffer.concat([d.update(raw.subarray(28)), d.final()]));'
          [ -s input.json ] || { echo "no input"; exit 1; }
          [ -f sp1/elf/pool-guard-register ] || { echo "sp1/elf/pool-guard-register is not committed: build the program first"; exit 1; }
          # the program first, without a proof: seconds, and its public values are what the proof commits
          timeout 600 "$PG_PROVER" execute --elf sp1/elf/pool-guard-register --input input.json > exec.json
          tail -1 exec.json | cut -c1-300; echo
          PV=$(node -e 'process.stdout.write(JSON.parse(require("fs").readFileSync("exec.json","utf8").trim().split("\n").pop()).publicValues)')
          VK=$(node -e 'process.stdout.write(JSON.parse(require("fs").readFileSync("sp1/elf/vkey.json","utf8")).vkey)')
          OUT="proof-${{ inputs.request }}.json"
          set -o pipefail
          # the stage log streams line by line; the proof JSON goes to the file, not the log
          quiet() { grep --line-buffered -v '"proof":"0x' || true; }

          # 1. The split. pg-prover runs every stage up to the Groth16 wrap, then hands gnark a
          #    witness through docker. A stand-in for docker keeps that witness and ends pg-prover,
          #    so gnark then runs with the runner's memory to itself instead of beside 10 GB of
          #    prover state in swap; pg-prover finish assembles the proof and checks it with
          #    Succinct's verifier. One recursion worker per core keeps the earlier stages in memory.
          mkdir -p shim split
          cat > shim/docker <<'SH'
          #!/usr/bin/env bash
          if [ "$1" = run ] && printf '%s\n' "$@" | grep -qx prove; then
            prev= circuit= witness=
            for a in "$@"; do
              if [ "$prev" = -v ]; then case "$a" in *:/circuit) circuit="${a%:/circuit}" ;; *:/witness) witness="${a%:/witness}" ;; esac; fi
              prev="$a"
            done
            image=$(printf '%s\n' "$@" | grep -x -B1 prove | head -1)
            cp "$witness" "$PG_SPLIT_DIR/witness.json" && printf '%s' "$circuit" > "$PG_SPLIT_DIR/circuit" && printf '%s' "$image" > "$PG_SPLIT_DIR/image"
            echo "[split] the wrap is done; gnark gets its own run" >&2
            kill -9 "$PPID"; exit 1
          fi
          exec /usr/bin/docker "$@"
          SH
          sed -i 's/^          //' shim/docker; chmod +x shim/docker
          if PATH="$PWD/shim:$PATH" PG_SPLIT_DIR="$PWD/split" SP1_WORKER_NUM_RECURSION_PROVER_WORKERS=4 SP1_WORKER_RECURSION_PROVER_BUFFER_SIZE=4 \
             timeout 3000 "$PG_PROVER" prove --elf sp1/elf/pool-guard-register --input input.json --out "$OUT" | quiet; then :; fi
          if ! [ -s "$OUT" ] && [ -s split/witness.json ] && [ -s split/image ]; then
            : > split/gnark.out
            echo "[split] gnark: $(date -u +%H:%M:%S)"
            if docker run --rm -v "$(cat split/circuit)":/circuit -v "$PWD/split/witness.json":/witness -v "$PWD/split/gnark.out":/output "$(cat split/image)" prove --system groth16 /circuit /witness /output; then
              "$PG_PROVER" finish --gnark split/gnark.out --circuit "$(cat split/circuit)" --public-values "$PV" --vkey "$VK" --out "$OUT" > /dev/null \
                && echo "[split] proof made and verified: $(date -u +%H:%M:%S)" || rm -f "$OUT"
            fi
          fi

          # 2. The fallback: the whole proof in one run, with the prover's own settings, as before
          if ! [ -s "$OUT" ]; then
            echo "the split did not make a proof; proving in one run"
            "$PG_PROVER" prove --elf sp1/elf/pool-guard-register --input input.json --out "$OUT" | quiet
          fi
          [ -s "$OUT" ] || { echo "no proof was written"; exit 1; }
      - name: Publish the proof
        if: steps.have.outputs.done == '0'
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release view proofs >/dev/null 2>&1 || gh release create proofs --title "proofs (rolling)" --notes "SP1 proofs made by the prove workflow, one JSON per request id. Safe to delete old ones." --latest=false
          gh release upload proofs "proof-${{ inputs.request }}.json" --clobber
